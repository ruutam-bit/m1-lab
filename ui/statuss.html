<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesnieguma statuss · Ezermalas novada pašvaldība</title>
  <style>
    :root {
      --navy: #1D3557;
      --teal: #2A9D8F;
      --coral: #E76F51;
      --bg: #F1F3F5;
      --line: #C9CED6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1a1a1a;
    }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input {
      width: 100%; padding: 8px; margin-top: 4px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    button {
      margin-top: 16px; padding: 10px 20px; font: inherit; font-weight: 600;
      color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { padding: 12px; border-radius: 6px; margin-top: 16px; }
    .message.error { background: #fdece7; border: 1px solid var(--coral); }
    .message.ok { background: #e6f4f2; border: 1px solid var(--teal); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 8px 0 0; }
    dt { font-weight: 600; }
    dd { margin: 0; }
    footer { font-size: 0.8rem; color: #555; text-align: center; padding: 16px; }
    a { color: var(--navy); }
  </style>
</head>
<body>
  <header>
    <h1>Ezermalas novada pašvaldība · Iesnieguma statuss</h1>
    <p>Mācību prototips. Pašvaldība ir izdomāta. Ievadiet tikai sintētiskus datus.</p>
  </header>

  <main>
    <form id="status-form" class="card" novalidate>
      <label for="submissionId">Iesnieguma numurs</label>
      <input id="submissionId" name="submissionId" placeholder="IES-2026-000123" autocomplete="off">

      <button type="submit" id="submit">Pārbaudīt</button>
      <div id="message" aria-live="polite"></div>
    </form>
  </main>

  <footer>
    <a href="/ui/">Iesniegt iesniegumu</a> · <a href="/docs">Swagger UI (/docs)</a> · Ezermalas pieteikumu sistēma · mācību prototips
  </footer>

  <script>
    const STATUS_TEXT = {
      RECEIVED: "Saņemts",
      IN_PROGRESS: "Izskatīšanā",
      FORWARDED: "Pārsūtīts",
      ANSWERED: "Atbildēts",
      WITHDRAWN: "Atsaukts",
    };

    const form = document.getElementById("status-form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit");

    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}.${month}.${year}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text == null ? "" : String(text);
      return div.innerHTML;
    }

    // GET /submissions/{id} atgriež pilnu ierakstu (arī personas datus).
    // Lapa paņem tikai numuru, statusu un termiņu, pārējo neglabā un nerāda.
    function showResult(data) {
      message.className = "message ok";
      message.innerHTML = `
        <dl>
          <dt>Numurs</dt><dd>${escapeHtml(data.id)}</dd>
          <dt>Statuss</dt><dd>${escapeHtml(STATUS_TEXT[data.status] || data.status)}</dd>
          <dt>Atbildes termiņš</dt><dd>${escapeHtml(formatDate(data.dueDate))}</dd>
        </dl>`;
    }

    function showError(status, body) {
      const error = (body && body.error) || {};
      const title = status === 404 ? "Iesniegums nav atrasts" : "Statusu neizdevās iegūt";
      message.className = "message error";
      message.innerHTML = `<strong>${title}</strong> (HTTP ${status}${error.code ? ", " + escapeHtml(error.code) : ""})`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.innerHTML = "";
      const id = document.getElementById("submissionId").value.trim();
      submitButton.disabled = true;
      try {
        const response = await fetch(`/submissions/${encodeURIComponent(id)}`);
        let body = null;
        try { body = await response.json(); } catch (e) { /* nav JSON */ }
        if (response.status === 200) {
          showResult({ id: body.id, status: body.status, dueDate: body.dueDate });
        } else {
          showError(response.status, body);
        }
      } catch (error) {
        message.className = "message error";
        message.textContent = "Neizdevās sazināties ar serveri.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
