<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesnieguma statuss · Ezermalas novada pašvaldība</title>
  <style>
    :root {
      --navy: #1D3557;
      --teal: #2A9D8F;
      --coral: #E76F51;
      --bg: #F1F3F5;
      --line: #C9CED6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1a1a1a;
    }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; }
    input {
      width: 100%; padding: 10px; margin-top: 4px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
    button {
      margin-top: 16px; padding: 10px 20px; font: inherit; font-weight: 600;
      color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { padding: 12px; border-radius: 6px; margin-top: 16px; }
    .message.error { background: #fdece7; border: 1px solid var(--coral); }
    .result { margin-top: 16px; }
    .result dl { margin: 0; }
    .result dt { font-size: 0.85rem; color: #555; margin-top: 12px; }
    .result dt:first-child { margin-top: 0; }
    .result dd { margin: 2px 0 0; font-size: 1.1rem; font-weight: 600; color: var(--navy); }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: #e6f4f2; border: 1px solid var(--teal); color: var(--navy);
    }
    .remaining { display: block; font-size: 0.95rem; font-weight: 400; color: #333; margin-top: 2px; }
    .overdue { color: var(--coral); font-weight: 700; }
    footer { font-size: 0.8rem; color: #555; text-align: center; padding: 16px; }
    a { color: var(--navy); }
  </style>
</head>
<body>
  <header>
    <h1>Ezermalas novada pašvaldība · Iesnieguma statuss</h1>
    <p>Mācību prototips. Pašvaldība ir izdomāta. Ievadiet tikai sintētiskus datus.</p>
  </header>

  <main>
    <form id="status-form" class="card" novalidate>
      <label for="submissionId">Iesnieguma numurs</label>
      <input id="submissionId" name="submissionId" placeholder="IES-2026-000123" autocomplete="off">
      <button type="submit" id="submit">Pārbaudīt statusu</button>

      <div id="message" aria-live="polite"></div>
      <div id="result" class="result card" hidden aria-live="polite">
        <dl>
          <dt>Iesnieguma numurs</dt>
          <dd id="r-id"></dd>
          <dt>Statuss</dt>
          <dd><span id="r-status" class="badge"></span></dd>
          <dt>Atbildes termiņš</dt>
          <dd>
            <span id="r-due"></span>
            <span id="r-remaining" class="remaining"></span>
          </dd>
        </dl>
      </div>
    </form>
  </main>

  <footer>
    <a href="/ui/">Iesniegt iesniegumu</a> · Ezermalas pieteikumu sistēma · mācību prototips
  </footer>

  <script>
    const STATUS_TEXT = {
      RECEIVED: "Saņemts",
      IN_PROGRESS: "Izskatīšanā",
      FORWARDED: "Pārsūtīts",
      ANSWERED: "Atbildēts",
      WITHDRAWN: "Atsaukts",
    };
    // Slēgtam iesniegumam termiņu neskaita un kā nokavētu nerāda.
    const CLOSED_STATUSES = ["ANSWERED", "WITHDRAWN"];

    const MSG_NOT_FOUND = "Iesniegums ar šādu numuru nav atrasts. Pārbaudiet numuru.";
    const MSG_GENERIC = "Neizdevās ielādēt datus. Mēģiniet vēlreiz.";

    const form = document.getElementById("status-form");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submit");

    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}.${month}.${year}`;
    }

    // Dienas no šodienas (vietējā laikā) līdz termiņam; negatīvs skaitlis nozīmē nokavētu termiņu.
    function daysUntil(isoDate) {
      const [year, month, day] = isoDate.split("-").map(Number);
      const due = Date.UTC(year, month - 1, day);
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((due - today) / 86400000);
    }

    function remainingText(days) {
      if (days === 0) return "Termiņš ir šodien";
      const singular = days % 10 === 1 && days % 100 !== 11;
      return singular ? `Atlikusi ${days} diena` : `Atlikušas ${days} dienas`;
    }

    function showError(text) {
      result.hidden = true;
      message.className = "message error";
      message.textContent = text;
    }

    // GET /submissions/{id} atgriež pilnu ierakstu (arī personas datus).
    // Lapa paņem tikai numuru, statusu un termiņu, pārējo neglabā un nerāda.
    function showResult({ id, status, dueDate }) {
      message.className = "";
      message.textContent = "";

      document.getElementById("r-id").textContent = id;
      document.getElementById("r-status").textContent = STATUS_TEXT[status] || status;
      document.getElementById("r-due").textContent = formatDate(dueDate);

      const remaining = document.getElementById("r-remaining");
      remaining.className = "remaining";
      remaining.textContent = "";
      if (!CLOSED_STATUSES.includes(status)) {
        const days = daysUntil(dueDate);
        if (days < 0) {
          remaining.classList.add("overdue");
          remaining.textContent = "Termiņš nokavēts";
        } else {
          remaining.textContent = remainingText(days);
        }
      }
      result.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("submissionId").value.trim();
      submitButton.disabled = true;
      try {
        const response = await fetch(`/submissions/${encodeURIComponent(id)}`);
        if (response.status === 404) {
          showError(MSG_NOT_FOUND);
          return;
        }
        const body = response.ok ? await response.json() : null;
        // Tukšs numurs var trāpīt saraksta galapunktā, tāpēc pārbauda atbildes formu.
        if (!body || Array.isArray(body) || !body.status || !body.dueDate) {
          showError(MSG_GENERIC);
          return;
        }
        showResult({ id: body.id, status: body.status, dueDate: body.dueDate });
      } catch (error) {
        showError(MSG_GENERIC);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
